# Production stack on the Hetzner server (/opt/kopecjan):
#   caddy  terminates TLS on 80/443 and proxies to web
#   web    the Next.js standalone server, reachable only inside the compose network
#
# Deploy or update:
#   cd /opt/kopecjan && git pull && docker compose up -d --build
#
# Runtime secrets (ANTHROPIC_API_KEY, limits) live in /opt/kopecjan/.env, never in git.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kopecjan.cz}
        NEXT_PUBLIC_ANALYTICS_URL: ${NEXT_PUBLIC_ANALYTICS_URL:-}
        NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-}
        NEXT_PUBLIC_CHAT_ENABLED: ${NEXT_PUBLIC_CHAT_ENABLED:-false}
    image: kopecjan-web:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "3000"
    mem_limit: 768m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
